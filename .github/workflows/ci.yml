name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  kernel-and-canon:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false   # binaries are not needed for the kernel or the canon
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: canon lint
        run: python3 tools/canon_lint.py && python3 -m unittest tools/tests/test_canon_lint_items.py
      - name: coverage
        run: python3 tools/coverage_check.py
      - name: staged canon matches db/canon
        run: python3 tools/stage_canon_for_ue.py --check
      - name: ue_test.sh verdict (crafted logs)
        run: tools/tests/test_ue_test.sh
      - name: C API reach (every kernel call has a stage)
        run: python3 -m unittest tools/tests/test_capi_reach.py && python3 tools/capi_reach.py --check
      - name: the city layout (tests; places.csv current)
        run: python3 -m unittest tools/tests/test_city_layout.py && python3 tools/city_layout.py --check
      - name: art licence gate (tests; every asset allowed; credits current; scatter.csv current)
        run: pip install --quiet pillow numpy && python3 -m unittest discover -s tools/tests -p "test_art_*.py" && python3 tools/art/license_gate.py && python3 tools/art/scatter.py --check
      - name: mechanics registry (every C API call and canon table has a mechanic)
        run: python3 -m unittest tools/tests/test_mechanics_registry.py && python3 tools/mechanics_registry.py --check
      - name: build kernel
        run: cmake -S kernel -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j
      - name: kernel tests
        run: ctest --test-dir build --output-on-failure
