; WindowsEngine.ini — Windows overrides of DefaultEngine.ini [/SystemSettings].
; DefaultEngine keeps the heavy lighting off because it hangs RADV (AMD Mesa)
; on the designer's Linux machine. On Windows/D3D12 they are safe, and D-023
; carries the look on light: Lumen GI bounces the sun off the mud walls, and
; virtual shadow maps keep the low-poly silhouettes crisp.
[/SystemSettings]
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=1
r.Lumen.TraceMeshSDFs=1
r.VolumetricFog=1
r.VolumetricFog.GridPixelSize=8
r.SkyAtmosphere=1
r.Tonemapper.Sharpen=0.6
r.PSOPrecache.Components=1
r.PSOPrecache.Resources=1

[/Script/Engine.RendererSettings]
r.GenerateMeshDistanceFields=True
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.SupportSkyAtmosphere=True
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True