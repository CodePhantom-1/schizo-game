[/Script/UnrealEd.ProjectPackagingSettings]
; The kernel reads the canon as loose CSV files (Content/Sim/canon, staged by
; tools/stage_canon_for_ue.py). The cooker packages only cooked assets, so the
; folder is staged as non-UFS files beside the content: in a packaged build it
; lands at <Project>/Content/Sim/canon, the same path relative to
; FPaths::ProjectContentDir() as in the editor (audit U3, D-020).
+DirectoriesToAlwaysStageAsNonUFS=(Path="Sim/canon")
